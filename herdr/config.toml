[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "herdr plugin action invoke open-board --plugin local.windows-board"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "powershell -ExecutionPolicy Bypass -File \"C:\\Users\\jyepe\\Documents\\herdr-start-ils-stack.ps1\""

[ui]
status_indicators = "dots"
mouse_capture = true
right_click_passthrough_modifier = "alt"
